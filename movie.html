  <script>

      let searchBox = document.getElementById("search-area");
      let clk = document.getElementById("search") 
      
      clk.addEventListener("click",()=>{
        let moviename = searchBox.value.trim()
        getMovie(moviename)
      })

      searchBox.addEventListener("keydown", (e) => {
         if (e.key === "Enter") {
            getMovie(searchBox.value.trim());
          }
       });
      

      async function getMovie(movieName){
         let url = `https://www.omdbapi.com/?t=${movieName}&apikey=84eefa96`

         try{

          let data = await response.json()
          console.log(data)
          
          if(data.Response != "True"){
          alert("Enter The Correct Movie Name")
}

else{
